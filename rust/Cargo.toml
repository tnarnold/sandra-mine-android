[package]
name = "sandramine"
version = "0.1.0"
edition = "2024"
description = "JNI bridge between the SandraMine Android app and sandra-core"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The engine shared with the desktop app. Clone tnarnold/sandra-mine next to this repo.
sandra-core = { path = "../../sandra-mine/core" }
jni = "0.21.1"
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
