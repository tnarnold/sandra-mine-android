# SandraMine for Android: first-run settings. Copy to config.properties (build.sh does it once).
# Everything here can be changed later on the device (OK on the remote -> settings).
# config.properties is in .gitignore: your address stays out of git.

# Your Bitcoin address (the same as on your other machines, so they add up as one fleet).
btc_address =
# Worker name. Empty = "sm-" + the device model, e.g. "sm-bravia".
worker =
# Solo pool (public-pool.io charges no fee).
pool_host = public-pool.io
pool_port = 21496
# Cores used and CPU per core (%). Mining runs at the lowest priority either way.
threads = 2
cpu = 50
# auto, pt-BR or en.
language = auto
# Price currency on the screens (USD, BRL, EUR...). Empty = from the device language.
currency =
